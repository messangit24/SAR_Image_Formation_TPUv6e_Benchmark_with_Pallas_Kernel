# Lint + pure-function tests on every push/PR. The test suite is DB-free by
# design (132 pure tests, <1 s); assessments (which need Postgres+data) stay
# local via `make assess-*`.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q

  # Frontend type-check — the `web/` definition-of-done gate (AGENTS.md step 4),
  # now enforced in CI. Type-only, so no build/browser needed.
  web:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web

  # DB-backed integration: run synthetic scenarios through the REAL pipeline
  # (ingest -> pair -> corroborate -> anomaly cases) and fail on regression.
  # Separate job so the fast test/web jobs aren't gated on Postgres.
  integration:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (postgis + pgvector)
        run: docker compose up -d --build postgres
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Wait for Postgres + create the test DB
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U graphrag && break
            sleep 2
          done
          docker compose exec -T postgres psql -U graphrag -tc \
            "SELECT 1 FROM pg_database WHERE datname='graphrag_test'" | grep -q 1 \
            || docker compose exec -T postgres createdb -U graphrag graphrag_test
      - name: Migrate + run integration scenarios
        env:
          GRAG_RUN_INTEGRATION: "1"
          GRAG_DATABASE_URL: postgresql://graphrag:graphrag@localhost:5432/graphrag_test
        run: |
          uv run python -m migrate
          uv run pytest -m integration -q