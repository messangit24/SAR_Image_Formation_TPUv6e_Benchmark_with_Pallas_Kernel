apiVersion: v1
kind: Service
metadata:
  name: sar-pallas-multi-chip-svc
spec:
  clusterIP: None
  selector:
    app: sar-pallas-multi-chip-benchmark
  ports:
    - name: coordinator
      port: 1234
      targetPort: 1234
    - name: tpu-agent
      port: 8471
      targetPort: 8471
    - name: tpu-worker
      port: 8431
      targetPort: 8431
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sar-pallas-v6e-multi-chip-benchmark
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: sar-pallas-multi-chip-benchmark
        job-name: sar-pallas-v6e-multi-chip-benchmark
    spec:
      subdomain: sar-pallas-multi-chip-svc
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: mb-tpu-v6e-multi-8
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 2x4
      tolerations:
        - key: "google.com/tpu"
          operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: benchmark-code
          configMap:
            name: sar-pallas-multi-chip-code
            defaultMode: 0755
        - name: benchmark-output
          emptyDir: {}
        - name: benchmark-data
          emptyDir: {}
      containers:
        - name: tpu-multi-chip-benchmark
          image: us-docker.pkg.dev/cloud-tpu-images/jax-stable-stack/tpu:jax0.5.2-rev1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8471
              protocol: TCP
            - containerPort: 8431
              protocol: TCP
            - containerPort: 1234
              protocol: TCP
          securityContext:
            privileged: true
          env:
            - name: JAX_ENABLE_X64
              value: "False"
            - name: JAX_PLATFORMS
              value: "tpu"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: JAX_COORDINATION_SERVICE_TIMEOUT_S
              value: "1800"
            - name: JAX_COORDINATOR_ADDRESS
              value: "sar-pallas-v6e-multi-chip-benchmark-0.sar-pallas-multi-chip-svc.default.svc.cluster.local:1234"
            - name: JAX_NUM_PROCESSES
              value: "2"
            - name: TPU_WORKER_HOSTNAMES
              value: "sar-pallas-v6e-multi-chip-benchmark-0.sar-pallas-multi-chip-svc,sar-pallas-v6e-multi-chip-benchmark-1.sar-pallas-multi-chip-svc"
            - name: TPU_WORKER_ID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          resources:
            requests:
              google.com/tpu: "4"
            limits:
              google.com/tpu: "4"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: benchmark-code
              mountPath: /workspace/src
            - name: benchmark-output
              mountPath: /workspace/out
            - name: benchmark-data
              mountPath: /workspace/data/sar
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              echo "=== Starting Multi-Chip Real Umbra CPHD Benchmark on TPU v6e (Trillium) ==="
              echo "Worker Index: ${JOB_COMPLETION_INDEX}"
              echo "Coordinator: ${JAX_COORDINATOR_ADDRESS}"

              cd /workspace

              # 1. Install dependencies
              pip install --no-cache-dir Pillow scipy sarpy

              # 2. Download Umbra CPHD / SICD dataset from AWS S3
              mkdir -p /workspace/data/sar
              BASE_URL="https://umbra-open-data-catalog.s3.amazonaws.com/sar-data/tasks/ship_detection_testdata/3fcc50e4-413f-4782-b75a-cf3a0b662c12/2023-01-18-07-20-11_UMBRA-05"
              CPHD_FILE="2023-01-18-07-20-11_UMBRA-05_CPHD.cphd"
              SICD_FILE="2023-01-18-07-20-11_UMBRA-05_SICD.nitf"

              if [ ! -f /workspace/data/sar/$CPHD_FILE ]; then
                echo "[*] Downloading $CPHD_FILE..."
                curl -fSL -C - -o /workspace/data/sar/$CPHD_FILE "$BASE_URL/$CPHD_FILE"
              fi

              if [ ! -f /workspace/data/sar/$SICD_FILE ]; then
                echo "[*] Downloading $SICD_FILE..."
                curl -fSL -C - -o /workspace/data/sar/$SICD_FILE "$BASE_URL/$SICD_FILE"
              fi

              # 3. Setup workspace code
              cp /workspace/src/*.py /workspace/
              mkdir -p /workspace/reports /workspace/out

              # 4. Execute Multi-Chip CPHD Benchmark
              python3 run_pallas_cphd_multi_chip_benchmark.py \
                --cphd /workspace/data/sar/2023-01-18-07-20-11_UMBRA-05_CPHD.cphd \
                --sicd /workspace/data/sar/2023-01-18-07-20-11_UMBRA-05_SICD.nitf \
                --chip 512 \
                --pulses 512 \
                --upsample 2 \
                --tile-size-az 128 \
                --tile-size-rg 128 \
                --pulse-batch 16 \
                --out /workspace/out/v6e_multi_chip_benchmark \
                --report /workspace/reports/multi_chip_pallas_v6e_benchmark_report.md

              echo "=== Multi-Chip Benchmark Run Completed Cleanly on Worker ${JOB_COMPLETION_INDEX} ==="
              cat /workspace/reports/multi_chip_pallas_v6e_benchmark_report.md
