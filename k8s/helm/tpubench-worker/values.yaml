# Default values for tpubench-worker.
workloadType: "sar-cpu"  # sar-cpu | sar-tpu | modis-batch

image:
  repository: us-docker.pkg.dev/PROJECT_ID/tpubench/worker
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: tpubench-benchmark-sa
  gcpServiceAccount: tpubench-benchmark-sa@PROJECT_ID.iam.gserviceaccount.com

gcs:
  enabled: true
  bucketName: goldthread-raw-data
  mountPath: /data

job:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600

# Overridable command and args
command: []
args: []

# Benchmark specific presets
resources:
  cpu:
    requests:
      cpu: "64"
      memory: "256Gi"
    limits:
      cpu: "80"
      memory: "320Gi"
  modis:
    requests:
      cpu: "16"
      memory: "32Gi"
    limits:
      cpu: "32"
      memory: "64Gi"
  tpu:
    accelerator: tpu-v5-lite-podslice
    topology: 2x2x1
    chips: 4
    requests:
      cpu: "16"
      memory: "64Gi"
    limits:
      cpu: "32"
      memory: "128Gi"
