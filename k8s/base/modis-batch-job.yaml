apiVersion: batch/v1
kind: Job
metadata:
  name: modis-batch-job
  namespace: tpubench
  labels:
    app.kubernetes.io/name: modis-batch-job
    app.kubernetes.io/component: benchmark-worker
    app.kubernetes.io/part-of: goldthread
    tpubench.io/workload-type: modis-batch
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modis-batch-job
        tpubench.io/workload-type: modis-batch
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: tpubench-benchmark-sa
      restartPolicy: Never
      nodeSelector:
        tpubench.io/workload-type: cpu-benchmark
      containers:
        - name: worker
          image: us-docker.pkg.dev/PROJECT_ID/tpubench/worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.modis.distributed_batch"]
          args:
            - "--synthetic-granules"
            - "8"
            - "--workers"
            - "16"
          resources:
            requests:
              cpu: "16"
              memory: "32Gi"
            limits:
              cpu: "32"
              memory: "64Gi"
          volumeMounts:
            - name: gcs-data
              mountPath: /data
              readOnly: true
            - name: output-dir
              mountPath: /workspace/out
      volumes:
        - name: gcs-data
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: BUCKET_NAME
              mountOptions: "implicit-dirs"
        - name: output-dir
          emptyDir: {}
