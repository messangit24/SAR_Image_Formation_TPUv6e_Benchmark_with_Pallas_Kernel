apiVersion: batch/v1
kind: Job
metadata:
  name: sar-tpu-benchmark
  namespace: tpubench
  labels:
    app.kubernetes.io/name: sar-tpu-benchmark
    app.kubernetes.io/component: benchmark-worker
    app.kubernetes.io/part-of: goldthread
    tpubench.io/workload-type: sar-tpu
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sar-tpu-benchmark
        tpubench.io/workload-type: sar-tpu
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: tpubench-benchmark-sa
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
        cloud.google.com/gke-tpu-topology: 2x2x1
      tolerations:
        - key: "google.com/tpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: worker
          image: us-docker.pkg.dev/PROJECT_ID/tpubench/worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.sar.tpu_ffbp"]
          args:
            - "--cphd"
            - "/data/sar/Bingham.cphd"
            - "--device"
            - "tpu"
          env:
            - name: JAX_ENABLE_X64
              value: "True"
            - name: LIBTPU_INIT_ARGS
              value: "--xla_tpu_enable_megacore=true"
          resources:
            requests:
              google.com/tpu: "4"
              cpu: "16"
              memory: "64Gi"
            limits:
              google.com/tpu: "4"
              cpu: "32"
              memory: "128Gi"
          volumeMounts:
            - name: gcs-data
              mountPath: /data
              readOnly: true
            - name: output-dir
              mountPath: /workspace/out
      volumes:
        - name: gcs-data
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: BUCKET_NAME
              mountOptions: "implicit-dirs"
        - name: output-dir
          emptyDir: {}
