apiVersion: v1
kind: Pod
metadata:
  name: test-gcsfuse-mount
  annotations:
    gke-gcsfuse/volumes: "true"
spec:
  serviceAccountName: tpu-gcs-sa
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: mb-tpu-v6e-multi-8
  tolerations:
  - key: "google.com/tpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"
  containers:
  - name: test-gcsfuse
    image: google/cloud-sdk:slim
    command: ["sh", "-c", "ls -lh /data/test && cat /data/test/sample_stream_test.txt && echo '=== GCS FUSE ON TPU NODE SUCCESSFUL ==='"]
    volumeMounts:
    - name: gcs-fuse-csi-vol
      mountPath: /data
      readOnly: true
  volumes:
  - name: gcs-fuse-csi-vol
    csi:
      driver: gcsfuse.csi.storage.gke.io
      volumeAttributes:
        bucketName: umbra-sar-dataset-75tb-mb-development-447000
        mountOptions: "implicit-dirs"
